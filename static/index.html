<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper RAG</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Markdown 渲染与 XSS 过滤；CDN 不可用时前端会自动退化为纯文本显示 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📄</span>
      <span>Paper RAG</span>
      <span class="sub" id="models"></span>
    </div>
    <div class="index-status" id="indexStatus">读取索引状态…</div>
    <button class="ghost" id="toggleSettings">⚙ 设置</button>
  </header>

  <section class="settings hidden" id="settings">
    <div class="group" id="indexGroup">
      <h4>建立索引（步骤 1-3：解析 → 切块 → 向量化）</h4>
      <label>切块方法
        <select id="method"></select>
      </label>
      <label>chunk_size <input type="number" id="chunkSize" min="100" max="8000" step="50" /></label>
      <label>overlap <input type="number" id="chunkOverlap" min="0" max="2000" step="10" /></label>
      <button id="rebuild">重建索引</button>
      <span class="hint" id="filesHint"></span>
    </div>
    <div class="group">
      <h4>检索与生成（步骤 4-5）</h4>
      <label>Top-K <input type="number" id="topK" min="1" max="20" /></label>
      <label class="check"><input type="checkbox" id="rewrite" checked /> 多轮查询改写</label>
      <label class="check"><input type="checkbox" id="thinking" /> 深度思考</label>
    </div>
  </section>

  <main class="layout">
    <!-- 左侧：多轮对话 -->
    <section class="panel chat">
      <div class="panel-head">
        <h3>对话</h3>
        <button class="ghost small" id="newChat">新对话</button>
      </div>
      <div class="messages" id="messages">
        <div class="empty" id="emptyChat">
          <p>向你的论文库提问吧，例如：</p>
          <ul>
            <li class="example">这些论文主要解决了什么问题？</li>
            <li class="example">文中的方法和 baseline 相比有哪些改进？</li>
            <li class="example">实验使用了哪些数据集和评价指标？</li>
          </ul>
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="input" rows="2" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button type="submit" id="send">发送</button>
      </form>
    </section>

    <!-- 右侧：检索结果 -->
    <aside class="panel results">
      <div class="panel-head">
        <h3>检索结果</h3>
        <span class="count" id="resultCount"></span>
      </div>
      <div class="query-used hidden" id="queryUsed"></div>
      <div class="chunks" id="chunks">
        <div class="empty">提问后，这里会展示从知识库中召回的片段、排名和相关性分数。</div>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
